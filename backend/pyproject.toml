[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
    "sse-starlette>=3.4.11",
