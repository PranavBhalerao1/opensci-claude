[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=1.11.0",
    "e2b>=2.51.0",
    "fastapi>=0.141.1",
    "google-colab-cli==0.7.4; sys_platform != 'win32'",
    "httpx>=0.28.1",
    "modal>=1.5.5",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10.1",
    "sqlmodel>=0.0.47",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
